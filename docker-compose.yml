services:
  db:
    image: postgres:16-alpine
    container_name: pandora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pandora
      POSTGRES_PASSWORD: pandora
      POSTGRES_DB: pandora
    ports:
      # Host 55432 evita colisão com um PostgreSQL local já instalado em 5432
      - "55432:5432"
    volumes:
      - pandora-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandora -d pandora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pandora-pgdata:
