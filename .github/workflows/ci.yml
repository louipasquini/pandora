name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pandora_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pandora_test
      PORT: "3001"
      NODE_ENV: development
      # Credenciais de serviço — obrigatórias a partir da spec 003 (fixtures de CI).
      SERVICE_JWT_SECRET: ci-service-jwt-secret-com-pelo-menos-32-caracteres
      SERVICE_CLIENT_ID: pandora-panel
      SERVICE_CLIENT_SECRET: ci-service-client-secret-16
      CORS_ORIGIN: http://localhost:5174
      # Worker de ingestão (spec 006): sem laço de fundo na CI — a suíte e2e
      # dispara passadas explícitas.
      INGESTAO_WORKER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace backend

      - name: Apply migrations + seed RBAC
        run: |
          npm run prisma:migrate:deploy --workspace backend
          npm run --workspace backend prisma:seed
        # e2e recria schema isolado por execução e roda migrate+seed lá (test/setup-db.ts);
        # este passo cobre o schema `public` de pandora_test.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (unit — backend + frontend)
        run: npm test

      - name: Test (e2e — backend, Postgres real)
        run: npm run test:e2e

  timezone-matrix:
    # Prova que o parser de tempo do `core` (spec 002) é livre de locale:
    # a mesma suíte tem de passar idêntica sob qualquer TZ da máquina.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'America/Sao_Paulo', 'Asia/Tokyo']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (core/tempo) sob TZ=${{ matrix.tz }}
        run: npm test --workspace backend -- tempo
        env:
          TZ: ${{ matrix.tz }}
